version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: financial-life-db
    environment:
      POSTGRES_USER: ${DB_USER:-financiallife}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: ${DB_NAME:-financial_life_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-financiallife}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: financial-life-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - financial-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financial-life-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${DB_USER:-financiallife}:${DB_PASSWORD:-devpassword}@postgres:5432/${DB_NAME:-financial_life_dev}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - financial-network
    command: npm run start:dev

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: financial-life-ai
    environment:
      DATABASE_URL: postgres://${DB_USER:-financiallife}:${DB_PASSWORD:-devpassword}@postgres:5432/${DB_NAME:-financial_life_dev}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ai-service:/app
      - /app/__pycache__
    networks:
      - financial-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: financial-life-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - financial-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  financial-network:
    driver: bridge
